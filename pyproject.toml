[project]
name = "old-town-walk"
version = "0.3.0"
description = "Open map and elevation data as streamed 3D tiles, rendered with Strata"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "pyproj>=3.6", "tifffile>=2024.1.30", "mapbox-earcut>=1.0"]

[project.scripts]
old-town-walk = "old_town_walk.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["old_town_walk"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
